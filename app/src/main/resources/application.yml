spring:
  application:
    name: coreledger

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    # consumer:
    #   group-id: coreledger
    #   auto-offset-reset: earliest
    #   key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    #   value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    #   properties:
    #     spring.json.trusted.packages: "com.coreledger.*"

  # Active profile — override via env var in CI/prod: SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: dev

  # -----------------------------------------------------------------------
  # JPA / Hibernate — base config, profiles override ddl-auto and dialect
  # -----------------------------------------------------------------------
  jpa:
    open-in-view: false # never true — keeps DB sessions out of web layer
    show-sql: false # set true temporarily to debug queries, never in prod
    properties:
      hibernate:
        format_sql: true

kafka:
  topics:
    account-events: coreledger.account.events
    transfer-events: coreledger.transfer.events

# -----------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------
server:
  port: 8080
  error:
    include-stacktrace: never # never expose stack traces externally
    include-message: never # Spring's default error messages can leak internals

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
logging:
  level:
    com.coreledger: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# -----------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# -----------------------------------------------------------------------
# Custom application properties
# -----------------------------------------------------------------------
app:
  banking:
    minimum-balance: ${APP_BANKING_MINIMUM_BALANCE:1000.00}

---
# -----------------------------------------------------------------------
# DEV profile — real Postgres (matches prod behaviour, catches real DB issues early)
# Requires: docker-compose up (or local Postgres on 5432)
# -----------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:coreledger}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate # auto-alters schema on startup — fine for dev, never prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# -----------------------------------------------------------------------
# TEST profile — H2 in-memory (fast, no external dependencies for tests)
# -----------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:coreledger-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop # fresh schema per test run
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092 # won't be used — auto-config disabled below
  autoconfigure:
    exclude: >
      org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

---
# -----------------------------------------------------------------------
# PROD profile — all secrets via env vars, never hardcoded
# -----------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # validate only — schema managed by migrations (Flyway/Liquibase)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

logging:
  level:
    com.coreledger: INFO # less noise in prod
    org.hibernate.SQL: WARN
