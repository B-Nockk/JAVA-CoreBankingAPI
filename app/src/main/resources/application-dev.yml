spring:
  datasource:
    url: jdbc:h2:mem:coreledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true # accessible at /h2-console during dev
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop # fresh schema every restart in dev
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
